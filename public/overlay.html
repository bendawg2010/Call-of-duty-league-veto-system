<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CDL Overlay</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: transparent;
      font-family: 'Segoe UI', 'Arial Narrow', Arial, sans-serif;
      width: 1920px;
      height: 1080px;
      overflow: hidden;
      color: #fff;
    }

    /* ─── Scoreboard Bar ─── */
    .scorebar {
      position: absolute;
      bottom: 60px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: stretch;
      min-width: 620px;
      height: 64px;
      filter: drop-shadow(0 4px 24px rgba(0,0,0,0.7));
    }

    .team-block {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0 24px;
      min-width: 220px;
      position: relative;
      overflow: hidden;
    }
    .team-block::before {
      content: '';
      position: absolute;
      inset: 0;
      background: var(--color);
      opacity: 0.15;
    }
    .team-block-bg {
      position: absolute;
      inset: 0;
      background: rgba(8,8,14,0.92);
    }
    .team-block-content {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .team-block.left { border-right: none; }
    .team-block.left .team-block-content { flex-direction: row; }
    .team-block.right { border-left: none; }
    .team-block.right .team-block-content { flex-direction: row-reverse; }

    .team-color-bar {
      width: 4px;
      align-self: stretch;
      border-radius: 2px;
    }
    .team-block.left .team-color-bar { border-radius: 0 2px 2px 0; }
    .team-block.right .team-color-bar { border-radius: 2px 0 0 2px; }

    .team-name {
      font-size: 18px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 2px;
      white-space: nowrap;
    }

    .score-center {
      display: flex;
      align-items: center;
      background: rgba(8,8,14,0.96);
      border-left: 2px solid rgba(255,255,255,0.08);
      border-right: 2px solid rgba(255,255,255,0.08);
      padding: 0 20px;
      gap: 12px;
      min-width: 120px;
      justify-content: center;
    }
    .score-num {
      font-size: 36px;
      font-weight: 900;
      line-height: 1;
      font-variant-numeric: tabular-nums;
    }
    .score-sep {
      font-size: 20px;
      color: rgba(255,255,255,0.3);
      font-weight: 300;
    }

    /* ─── Map Series Row ─── */
    .series-row {
      position: absolute;
      bottom: 134px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 6px;
      filter: drop-shadow(0 2px 12px rgba(0,0,0,0.6));
    }

    .game-chip {
      background: rgba(8,8,14,0.9);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 6px;
      padding: 7px 14px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      min-width: 110px;
      transition: all 0.3s;
      position: relative;
      overflow: hidden;
    }
    .game-chip::before {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 2px;
    }
    .game-chip.mode-hp::before { background: #00c8ff; }
    .game-chip.mode-snd::before { background: #ffd600; }
    .game-chip.mode-control::before { background: #ff6b35; }

    .game-chip.winner-1::before { background: var(--team1-color, #0057B8); height: 100%; opacity: 0.15; }
    .game-chip.winner-2::before { background: var(--team2-color, #E8003D); height: 100%; opacity: 0.15; }

    .chip-game { font-size: 9px; color: rgba(255,255,255,0.4); text-transform: uppercase; letter-spacing: 1px; }
    .chip-mode { font-size: 9px; color: rgba(255,255,255,0.5); text-transform: uppercase; letter-spacing: 1px; }
    .chip-map { font-size: 13px; font-weight: 700; text-align: center; white-space: nowrap; }
    .chip-map.tbd { color: rgba(255,255,255,0.25); font-style: italic; font-size: 11px; font-weight: 400; }
    .chip-winner { font-size: 9px; text-transform: uppercase; letter-spacing: 1px; font-weight: 700; margin-top: 1px; }

    /* ─── Veto Panel ─── */
    .veto-panel {
      position: absolute;
      top: 60px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(8,8,14,0.92);
      border: 1px solid rgba(255,255,255,0.1);
      border-top: 3px solid #00c8ff;
      border-radius: 0 0 10px 10px;
      padding: 20px 28px;
      min-width: 800px;
      filter: drop-shadow(0 4px 24px rgba(0,0,0,0.7));
    }
    .veto-title {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 3px;
      color: #00c8ff;
      margin-bottom: 14px;
      text-align: center;
    }

    .veto-modes {
      display: flex;
      gap: 20px;
      justify-content: center;
    }
    .veto-mode-col {
      display: flex;
      flex-direction: column;
      gap: 6px;
      min-width: 220px;
    }
    .veto-mode-label {
      font-size: 9px;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: rgba(255,255,255,0.4);
      margin-bottom: 4px;
    }
    .veto-map-item {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      padding: 4px 0;
    }
    .veto-map-item .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .veto-map-item.available .dot { background: rgba(255,255,255,0.2); }
    .veto-map-item.banned { opacity: 0.4; text-decoration: line-through; }
    .veto-map-item.banned .dot { background: #e8003d; }
    .veto-map-item.picked .dot { background: #00e676; }
    .veto-map-item.auto-picked .dot { background: #ffd600; }

    .veto-action-box {
      margin-top: 14px;
      text-align: center;
      padding: 10px;
      background: rgba(255,255,255,0.04);
      border-radius: 6px;
    }
    .veto-action-team { font-size: 14px; font-weight: 800; text-transform: uppercase; letter-spacing: 2px; }
    .veto-action-desc { font-size: 11px; color: rgba(255,255,255,0.5); margin-top: 3px; }

    .veto-progress-bar {
      display: flex;
      gap: 3px;
      justify-content: center;
      margin-top: 12px;
    }
    .vpb-dot { width: 20px; height: 4px; border-radius: 2px; background: rgba(255,255,255,0.1); }
    .vpb-dot.done { background: #00c8ff; }
    .vpb-dot.current { background: #ffd600; }

    /* ─── Animations ─── */
    @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    .animate { animation: fadeIn 0.4s ease forwards; }

    /* ─── Complete Banner ─── */
    .complete-banner {
      position: absolute;
      top: 60px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(8,8,14,0.95);
      border: 1px solid rgba(255,255,255,0.1);
      border-top: 3px solid #ffd600;
      border-radius: 0 0 10px 10px;
      padding: 20px 40px;
      text-align: center;
      filter: drop-shadow(0 4px 24px rgba(0,0,0,0.7));
      display: none;
    }
    .complete-banner.show { display: block; animation: fadeIn 0.5s ease; }
    .complete-label { font-size: 10px; color: rgba(255,255,255,0.4); text-transform: uppercase; letter-spacing: 3px; margin-bottom: 6px; }
    .complete-winner { font-size: 28px; font-weight: 900; text-transform: uppercase; letter-spacing: 3px; }

    /* Connection indicator */
    .conn-dot {
      position: fixed;
      top: 8px;
      right: 8px;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #e8003d;
    }
    .conn-dot.connected { background: #00e676; }
  </style>
</head>
<body>

<!-- Connection indicator (hidden in OBS) -->
<div class="conn-dot" id="conn-dot"></div>

<!-- Veto Panel -->
<div class="veto-panel animate" id="veto-panel" style="display:none;">
  <div class="veto-title">&#9878; Map Veto</div>
  <div class="veto-modes" id="veto-modes"></div>
  <div class="veto-action-box" id="veto-action-box" style="display:none;">
    <div class="veto-action-team" id="va-team"></div>
    <div class="veto-action-desc" id="va-desc"></div>
  </div>
  <div class="veto-progress-bar" id="veto-progress-bar"></div>
</div>

<!-- Complete Banner -->
<div class="complete-banner" id="complete-banner">
  <div class="complete-label">Series Winner</div>
  <div class="complete-winner" id="complete-winner-name">—</div>
</div>

<!-- Map Series Chips -->
<div class="series-row animate" id="series-row"></div>

<!-- Scoreboard Bar -->
<div class="scorebar animate" id="scorebar">
  <div class="team-block left" id="team1-block" style="--color:#0057B8;">
    <div class="team-block-bg"></div>
    <div class="team-block-content">
      <div class="team-color-bar" id="t1-bar" style="background:#0057B8;"></div>
      <div class="team-name" id="t1-name">TEAM 1</div>
    </div>
  </div>
  <div class="score-center">
    <div class="score-num" id="t1-score">0</div>
    <div class="score-sep">-</div>
    <div class="score-num" id="t2-score">0</div>
  </div>
  <div class="team-block right" id="team2-block" style="--color:#E8003D;">
    <div class="team-block-bg"></div>
    <div class="team-block-content">
      <div class="team-name" id="t2-name">TEAM 2</div>
      <div class="team-color-bar" id="t2-bar" style="background:#E8003D;"></div>
    </div>
  </div>
</div>

<script>
  let state = null;
  let ws = null;

  const VETO_STEPS = [
    { action:'ban',  mode:'hp',      team:1 },
    { action:'ban',  mode:'hp',      team:2 },
    { action:'ban',  mode:'hp',      team:1 },
    { action:'ban',  mode:'hp',      team:2 },
    { action:'pick', mode:'hp',      team:2, game:1 },
    { action:'ban',  mode:'snd',     team:2 },
    { action:'ban',  mode:'snd',     team:1 },
    { action:'ban',  mode:'snd',     team:2 },
    { action:'ban',  mode:'snd',     team:1 },
    { action:'pick', mode:'snd',     team:1, game:2 },
    { action:'ban',  mode:'control', team:1 },
    { action:'ban',  mode:'control', team:2 },
  ];

  const MODE_LABELS = { hp:'Hardpoint', snd:'S&D', control:'Control' };
  const MODE_ABBR   = { hp:'HP', snd:'SnD', control:'CTL' };

  function connectWS() {
    const proto = location.protocol === 'https:' ? 'wss' : 'ws';
    ws = new WebSocket(`${proto}://${location.host}`);
    ws.onopen = () => document.getElementById('conn-dot').classList.add('connected');
    ws.onclose = () => {
      document.getElementById('conn-dot').classList.remove('connected');
      setTimeout(connectWS, 2000);
    };
    ws.onmessage = (e) => {
      const msg = JSON.parse(e.data);
      if (msg.type === 'state') { state = msg.data; render(); }
    };
  }

  function teamName(n) { return state.teams[`team${n}`].name.toUpperCase(); }
  function teamColor(n) { return state.teams[`team${n}`].color; }

  function render() {
    if (!state) return;
    renderScorebar();
    renderSeries();
    renderVeto();
    renderComplete();
  }

  function renderScorebar() {
    document.getElementById('t1-name').textContent = teamName(1);
    document.getElementById('t2-name').textContent = teamName(2);
    document.getElementById('t1-score').textContent = state.teams.team1.score;
    document.getElementById('t2-score').textContent = state.teams.team2.score;
    document.getElementById('t1-bar').style.background = teamColor(1);
    document.getElementById('t2-bar').style.background = teamColor(2);
    document.getElementById('team1-block').style.setProperty('--color', teamColor(1));
    document.getElementById('team2-block').style.setProperty('--color', teamColor(2));

    // Set CSS vars for series chips
    document.documentElement.style.setProperty('--team1-color', teamColor(1));
    document.documentElement.style.setProperty('--team2-color', teamColor(2));
  }

  function renderSeries() {
    const row = document.getElementById('series-row');
    row.innerHTML = '';
    state.series.forEach(game => {
      const chip = document.createElement('div');
      chip.className = `game-chip mode-${game.mode}${game.winner ? ` winner-${game.winner}` : ''}`;

      let mapHTML, winnerHTML = '';
      if (game.map) {
        mapHTML = `<div class="chip-map">${game.map}</div>`;
        if (game.winner) {
          const col = teamColor(game.winner);
          winnerHTML = `<div class="chip-winner" style="color:${col}">${teamName(game.winner)}</div>`;
        }
      } else {
        mapHTML = `<div class="chip-map tbd">TBD</div>`;
      }

      chip.innerHTML = `
        <div class="chip-game">Game ${game.game}</div>
        <div class="chip-mode">${MODE_ABBR[game.mode]}</div>
        ${mapHTML}
        ${winnerHTML}
      `;
      row.appendChild(chip);
    });
  }

  function renderVeto() {
    const panel = document.getElementById('veto-panel');
    const { phase, veto } = state;

    if (phase !== 'veto') { panel.style.display = 'none'; return; }
    panel.style.display = '';

    const totalSteps = VETO_STEPS.length;
    const curStep = veto.currentStep;

    // Mode columns
    const modesDiv = document.getElementById('veto-modes');
    modesDiv.innerHTML = '';

    ['hp','snd','control'].forEach(mode => {
      const col = document.createElement('div');
      col.className = 'veto-mode-col';

      const label = document.createElement('div');
      label.className = 'veto-mode-label';
      label.textContent = MODE_LABELS[mode];
      col.appendChild(label);

      const allMaps = state.mapPool[mode] || [];
      const bans = (veto.bans[mode]||[]).map(b=>b.map);
      const picks = (veto.picks[mode]||[]).map(p=>p.map);
      const autoMaps = state.series.filter(g=>g.map&&g.mode===mode&&g.pickedBy==='auto').map(g=>g.map);

      allMaps.forEach(map => {
        const item = document.createElement('div');
        if (bans.includes(map)) {
          item.className = 'veto-map-item banned';
        } else if (picks.includes(map)) {
          item.className = 'veto-map-item picked';
        } else if (autoMaps.includes(map)) {
          item.className = 'veto-map-item auto-picked';
        } else {
          item.className = 'veto-map-item available';
        }
        item.innerHTML = `<div class="dot"></div><span>${map}</span>`;
        col.appendChild(item);
      });
      modesDiv.appendChild(col);
    });

    // Current action
    const actionBox = document.getElementById('veto-action-box');
    if (curStep < totalSteps) {
      actionBox.style.display = '';
      const step = VETO_STEPS[curStep];
      const vaTeam = document.getElementById('va-team');
      vaTeam.textContent = teamName(step.team);
      vaTeam.style.color = teamColor(step.team);
      const actionWord = step.action === 'ban' ? 'BANNING' : 'PICKING';
      const gameLabel = step.game ? ` (Game ${step.game})` : '';
      document.getElementById('va-desc').textContent =
        `${actionWord} a ${MODE_LABELS[step.mode]} map${gameLabel}`;
    } else {
      actionBox.style.display = 'none';
    }

    // Progress
    const progBar = document.getElementById('veto-progress-bar');
    progBar.innerHTML = '';
    for (let i = 0; i < totalSteps; i++) {
      const d = document.createElement('div');
      d.className = 'vpb-dot' + (i < curStep ? ' done' : i === curStep ? ' current' : '');
      progBar.appendChild(d);
    }
  }

  function renderComplete() {
    const banner = document.getElementById('complete-banner');
    if (state.phase === 'complete') {
      const w = state.teams.team1.score >= 3 ? 1 : 2;
      const el = document.getElementById('complete-winner-name');
      el.textContent = teamName(w);
      el.style.color = teamColor(w);
      banner.classList.add('show');
    } else {
      banner.classList.remove('show');
    }
  }

  connectWS();
</script>
</body>
</html>
